<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Details</title>
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* Body Background */
        body {
            background: url('https://wallpaperaccess.com/full/1978968.jpg') no-repeat center center/cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Form Container */
        .form-container {
            background-color: rgba(10, 10, 10, 0.9);
            width: 90%;
            max-width: 400px;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #ff7200;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #fefefe;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border: 1px solid #ff7200;
        }

        .error-message {
            color: red;
            font-size: 12px;
            margin-top: 5px;
        }

        .btn {
            background-color: #ff7200;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            font-size: 16px;
            text-transform: uppercase;
        }

        .btn:hover {
            background-color: #e65e00;
        }

        .success-message {
            display: none;
            color: green;
            font-weight: bold;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Car Details</h2>
        <div class="form-group">
            <label for="vehicle-number">Vehicle Number</label>
            <input type="text" id="vehicle-number" placeholder="Enter vehicle number">
            <div class="error-message" id="error-vehicle-number"></div>
        </div>
        <div class="form-group">
            <label for="owner-name">Vehicle Owner Name</label>
            <input type="text" id="owner-name" placeholder="Enter owner's name">
            <div class="error-message" id="error-owner-name"></div>
        </div>
        <div class="form-group">
            <label for="owner-phone">Owner's Phone Number</label>
            <input type="text" id="owner-phone" placeholder="Enter owner's phone number">
            <div class="error-message" id="error-owner-phone"></div>
        </div>
        <button class="btn" id="proceed-btn">Proceed</button>
        <div class="success-message" id="success-message">Details Submitted Successfully!</div>
    </div>

    <script>
        const proceedBtn = document.getElementById('proceed-btn');

        proceedBtn.addEventListener('click', function () {
            const vehicleNumber = document.getElementById('vehicle-number').value.trim();
            const ownerName = document.getElementById('owner-name').value.trim();
            const ownerPhone = document.getElementById('owner-phone').value.trim();

            let isValid = true;

            // Reset Error Messages
            document.getElementById('error-vehicle-number').textContent = '';
            document.getElementById('error-owner-name').textContent = '';
            document.getElementById('error-owner-phone').textContent = '';

            // Validate Vehicle Number
            if (vehicleNumber === '') {
                document.getElementById('error-vehicle-number').textContent = 'Vehicle number is required.';
                isValid = false;
            } else if (!/^[A-Z0-9 ]{6,12}$/.test(vehicleNumber)) {
                document.getElementById('error-vehicle-number').textContent = 'Enter a valid vehicle number (e.g., AB12CD1234).';
                isValid = false;
            }

            // Validate Owner Name
            if (ownerName === '') {
                document.getElementById('error-owner-name').textContent = 'Owner name is required.';
                isValid = false;
            } else if (!/^[a-zA-Z ]+$/.test(ownerName)) {
                document.getElementById('error-owner-name').textContent = 'Name must contain only alphabets.';
                isValid = false;
            }

            // Validate Phone Number
            if (ownerPhone === '') {
                document.getElementById('error-owner-phone').textContent = 'Phone number is required.';
                isValid = false;
            } else if (!/^\d{10}$/.test(ownerPhone)) {
                document.getElementById('error-owner-phone').textContent = 'Enter a valid 10-digit phone number.';
                isValid = false;
            }

            // Show Success Message if Valid
            if (isValid) {
                document.getElementById('success-message').style.display = 'block';
                setTimeout(() => {
                    alert('Car Details Submitted Successfully!');
                    // You can redirect or reset the form here if required
                    document.getElementById('success-message').style.display = 'none';
                }, 2000);
            }
        });
    </script>
</body>
</html>
