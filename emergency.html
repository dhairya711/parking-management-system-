<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Helpline</title>
    <style>
        /* General Styles */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: orange; /* Orange background */
            margin: 0;
            padding: 0;
            color: #fff;
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #ff7043; /* Slightly darker orange */
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .contact-section {
            margin: 30px 0;
        }

        .contact-section h2 {
            font-size: 1.8rem;
            margin-bottom: 15px;
        }

        .number {
            font-size: 1.5rem;
            font-weight: bold;
            background-color: #fff;
            color: #ff7043;
            padding: 10px 20px;
            border-radius: 10px;
            display: inline-block;
            margin: 10px 0;
        }

        .call-button {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;
            font-size: 1.2rem;
            color: #fff;
            background-color: #d84315; /* Bright red button */
            border: none;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .call-button:hover {
            background-color: #bf360c;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚨 Emergency Helpline</h1>
        <p>If you need immediate assistance at Phoenix Mall, please use the emergency contact details below. Our security team is here to help you!</p>

        <div class="contact-section">
            <h2>Emergency Contact Numbers</h2>
            <p class="number">📞 Helpline: <a href="tel:+911234567890">+91 12345 67890</a></p>
            <p class="number">📞 Security: <a href="tel:+919876543210">+91 98765 43210</a></p>
        </div>

        <a href="tel:+911234567890" class="call-button">📞 Call Helpline</a>
    </div>
</body>
</html>
